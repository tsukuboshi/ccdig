[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# unicode-ident is "(MIT OR Apache-2.0) AND Unicode-3.0".
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
