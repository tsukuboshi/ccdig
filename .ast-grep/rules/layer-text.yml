# .github/scripts/check-architecture.sh checks this rule against the module
# table in ARCHITECTURE.md.
id: layer-text
language: rust
severity: error
message: "text may use only failure"
note: |
  A module uses only those before it in the module table of
  ARCHITECTURE.md, or the ones its row names after "uses only".
files:
  - src/text.rs
  - src/text/**/*.rs
ignores:
  - src/**/tests.rs
  - src/**/tests/**/*.rs
rule:
  any:
    # crate::module::item for a module after this one, in a use or a path
    - kind: scoped_identifier
      regex: ^crate::(when|transcript|classify|redact|record|select|collect|render|config|pipeline|cli)$
    # use crate::{module, module::item, module::{..}, module as x}
    - any:
        - kind: identifier
        - kind: scoped_identifier
        - kind: scoped_use_list
        - kind: use_as_clause
      regex: ^(when|transcript|classify|redact|record|select|collect|render|config|pipeline|cli)\b
      inside:
        kind: use_list
        inside:
          kind: scoped_use_list
          has:
            field: path
            kind: crate
