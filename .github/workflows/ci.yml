---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Install the toolchain pinned in rust-toolchain.toml rather than one an
      # action picks, so CI lints with the same clippy as local runs.
      - run: rustup toolchain install
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Releases are built on macOS, so a failure there shows up before a tag.
  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f  # v2.90.6
        with:
          tool: cargo-deny@0.21.0
      - run: cargo deny check

  # The module order and where I/O may happen, as ARCHITECTURE.md describes.
  # clippy.toml checks the I/O in the check job; ast-grep checks the order,
  # and check-architecture.sh that ARCHITECTURE.md matches the rules.
  architecture:
    name: Module structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/check-architecture.sh
      # ast-grep/action runs only `ast-grep scan`, so install the CLI to run
      # the rule tests too. ast-grep publishes no binaries cargo-binstall
      # finds, so build it once per version and keep the binaries.
      - id: ast-grep
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin/ast-grep
            ~/.cargo/bin/sg
          key: ast-grep-0.51.0-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - if: steps.ast-grep.outputs.cache-hit != 'true'
        run: rustup toolchain install
      - if: steps.ast-grep.outputs.cache-hit != 'true'
        run: cargo install ast-grep --locked --version 0.51.0
      - run: ast-grep test
      - run: ast-grep scan --error=unused-suppression --error=no-suppress-all

  readme:
    name: README translation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/check-readme-sync.sh
