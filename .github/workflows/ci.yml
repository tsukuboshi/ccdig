---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  cargo-clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Install the toolchain pinned in rust-toolchain.toml rather than one an
      # action picks, so CI lints with the same clippy as local runs.
      - run: rustup toolchain install
      - run: rustup show active-toolchain
      - run: cargo clippy --all-targets --locked -- -D warnings

  cargo-test-linux:
    name: cargo test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --locked

  # Releases are built on macOS, so a failure there shows up before a tag.
  cargo-test-macos:
    name: cargo test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --locked

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f  # v2.90.6
        with:
          tool: cargo-deny@0.21.0
      - run: cargo deny check

  # Apart from cargo test: the instrumented build is slower, and its
  # test results should not stand in for the plain ones.
  cargo-llvm-cov:
    name: cargo llvm-cov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Only this job needs it, so rust-toolchain.toml leaves it out;
      # cargo-llvm-cov installs it by itself when run locally.
      - run: rustup component add llvm-tools
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f  # v2.90.6
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: .github/scripts/coverage.sh

  # The module order and where I/O may happen, as ARCHITECTURE.md describes.
  # clippy.toml checks the I/O in cargo clippy; ast-grep checks the order,
  # and check-architecture.sh that ARCHITECTURE.md matches the rules.
  ast-grep:
    name: ast-grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # ast-grep/action runs only `ast-grep scan`, so install the CLI to run
      # the rule tests too. Building it takes minutes, so take the release
      # binary, checked against the SHA-256 the release lists. To bump it,
      # change the version and the hash together.
      - name: Install ast-grep
        env:
          VERSION: 0.51.0
          SHA256: a7eead5552d3a8daad70f5d50d935da44bd0c138e946b5b0a96b1d38169fa639
        run: |
          zip=$RUNNER_TEMP/ast-grep.zip
          curl -fsSL -o "$zip" "https://github.com/ast-grep/ast-grep/releases/download/$VERSION/app-x86_64-unknown-linux-gnu.zip"
          echo "$SHA256  $zip" | sha256sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/ast-grep"
          echo "$RUNNER_TEMP/ast-grep" >>"$GITHUB_PATH"
      - run: ast-grep --version
      - run: ast-grep test
      - run: ast-grep scan --error=unused-suppression --error=no-suppress-all

  check-architecture:
    name: check-architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/check-architecture.sh

  check-readme-sync:
    name: check-readme-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/check-readme-sync.sh
